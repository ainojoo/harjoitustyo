<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Home</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">REENILMO</span>
            <div class="navbar-nav me-auto">
                <a href="/users" class="nav-link">Käyttäjät</a>
                <a href="/home" class="nav-link">Tapahtumat</a>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger">Log out</button>
            </form>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Moikka <span sec:authentication="name"></span>!</h1>
        <table class="table table-striped table-hover">
            <tr>
                <th>Tapahtuma</th>
                <th>Kuvaus</th>
                <th>PVM</th>
                <th>Ilmoittaudu</th>
                <th sec:authorize="hasAuthority('valmentaja')">Toiminnot</th>
            </tr>
            <tr th:each="event : ${events}">
                <td> <a th:href="@{/event/{id}(id=${event.id})}" th:text="${event.title}"></a></td>
                <td th:text="${event.desc}"></td>
                <td th:text="${event.date}"></td>
                <td>
                    <div class="mb-1">
                        <form th:action="@{/event/{id}/in(id=${event.id})}" method="post">
                            <button type="submit" class="btn btn-outline-success">IN</button>
                        </form>
                    </div>
                    <div class="mb-1">
                        <form th:action="@{/event/{id}/out(id=${event.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger">OUT</button>
                        </form>
                    </div>
                </td>
                <td sec:authorize="hasAuthority('valmentaja')">
                    <a th:href="@{/editevent/{id}(id=${event.id})}">Muokkaa</a>
                    <a th:href="@{/delete-event/{id}(id=${event.id})}">Poista</a>
                </td>

            </tr>
        </table>
        <a sec:authorize="hasAuthority('valmentaja')" href="/newevent">Lisää uusi tapahtuma</a>


    </div>
    <footer class="text-center text-muted mt-5">
        <p>REENILMO by AINO</p>
    </footer>
</body>

</html>
