<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Muokkaa käyttäjää</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">REENILMO</span>
            <div class="navbar-nav me-auto">
                <a href="/users" class="nav-link">Käyttäjät</a>
                <a href="/home" class="nav-link">Tapahtumat</a>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger">Log out</button>
            </form>
        </div>
    </nav>
    <div class="container mt-4">

        <h2>Muokkaa haluttuja tietoja</h2>
        <form th:object="${oldUser}" th:action="@{/users/update}" action="#" method="post">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{username}" />
            <input type="hidden" th:field="*{passwordHash}">

            <div class="mb-3">
                <label for="name" class="form-label">Nimi:</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
                <span th:errors="*{name}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="text" id="email" th:field="*{email}" class="form-control" />
                <span th:errors="*{email}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Puhelinnumero:</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control" />
                <span th:errors="*{phone}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="bday" class="form-label">Syntymäaika:</label>
                <input type="date" id="bday" th:field="*{bday}" class="form-control" />
                <span th:errors="*{bday}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Rooli:</label>
                <select th:field="*{role}">
                    <option th:each="role:${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                </select>
            </div>

            <div class="mb-3"><button type="submit">Tallenna</button></div>
        </form>


    </div>
    <footer class="text-center text-muted mt-5">
        <p>REENILMO by AINO</p>
    </footer>>
</body>

</html>
