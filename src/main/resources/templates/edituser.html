<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Muokkaa käyttäjää</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>REENILMO</h1>
    <h2>Muokkaa haluttuja tietoja</h2>
    <form th:object="${oldUser}" th:action="@{/users/save}" action="#" method="post">
        <input type="hidden" th:field="*{id}" />
        <label for="name">Nimi:</label>
        <input type="text" id="name" th:field="*{name}"/>
        <p></p>
        <label for="email">Email:</label>
        <input type="text"id="email" th:field="*{email}"/>
        <p></p>
        <label for="phone">Puhelinnumero:</label>
        <input type="text"id="phone" th:field="*{phone}"/>
        <p></p>
        <label for="bday">Syntymäaika:</label>
        <input type="text"id="bday" th:field="*{bday}"/>
        <p></p>
        <label for="role">Rooli</label>
        <select th:field="*{role}">
            <option th:each="role:${roles}" th:value="${role.id}" th:text="${role.name}"></option>
        </select>
        <p></p>
        <input type="submit" value="Tallenna"></input>
    </form>
</body>

</html>
