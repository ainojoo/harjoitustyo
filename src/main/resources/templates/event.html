<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Home</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">REENILMO</span>
            <div class="navbar-nav me-auto">
                <a href="/users" class="nav-link">Käyttäjät</a>
                <a href="/home" class="nav-link">Tapahtumat</a>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger">Log out</button>
            </form>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 th:text="${event.title}"></h1>

        <div class="mb-3">
            <strong>Päivämäärä:</strong>
            <span th:text="${#temporals.format(event.date, 'dd.MM.yyyy')}"></span>
        </div>

        <div class="mb3">
            <strong>Kuvaus:</strong>
            <span th:text="${event.desc}"></span>
        </div>
        
        <div class="mb3"><strong>Osallistujat:</strong></div>

        <table class="table table-striped table-hover">
            <tr th:each="participant : ${event.participants}">
                <td th:text="${#strings.capitalize(participant.participant.role.name)}"></td>
                <td th:text="${participant.participant.name}"></td>
                <td th:text="${participant.status}"></td>
                <td sec:authorize="hasAuthority('valmentaja')"
                    th:text="${#temporals.format(participant.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
            </tr>
        </table>
    </div>
    <footer class="text-center text-muted mt-5">
        <p>REENILMO by AINO</p>
    </footer>
</body>


</html>
