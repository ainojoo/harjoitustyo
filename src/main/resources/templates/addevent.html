<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Lisää tapahtuma</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>REENILMO</h1>
    <h2>Lisää uusi tapahtuma</h2>
    <form th:object="${event}" th:action="@{/save-event}" action="#" method="post">
        <label for="title">Nimi:</label>
        <input type="text" id="title" th:field="*{title}"/>
        <p></p>
        <label for="desc">Kuvaus:</label>
        <input type="text"id="desc" th:field="*{desc}"/>
        <p></p>
        <label for="date">Päivämäärä:</label>
        <input type="text"id="date" th:field="*{date}"/>
        <p></p>
        <input type="submit" value="Lisää tapahtuma"></input>
    </form>
</body>

</html>
