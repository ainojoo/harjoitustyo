<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Home</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Hello <span sec:authentication = "name"></span>!</h1>
    <table>
        <tr>
            <th>Nimi</th>
            <th>Email</th>
            <th>Puhelin</th>
            <th>Syntymäaika</th>
            <th>Rooli</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.phone}"></td>
            <td th:text="${user.bday}"></td>
            <td th:text="${user.role.name}"></td>
            <td><a th:href="@{/users/edit/{id}(id=${user.id})}">Muokkaa</a></td>
            <td><a th:href="@{/users/delete/{id}(id=${user.id})}">Poista</a></td>
        </tr>
    </table>
    <a href="/users/new">Lisää uusi käyttäjä</a>
</body>

</html>
