<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Home</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <header>
        REENILMO
        <a href="/users">Käyttäjät</a>
        <a href="/home">Tapahtumat</a>
    </header>
    <h1>Moikka <span sec:authentication = "name"></span>!</h1>
    <table>
        <tr>
            <th>Nimi</th>
            <th>Email</th>
            <th>Puhelin</th>
            <th>Syntymäaika</th>
            <th>Rooli</th>
            <th sec:authorize="hasAuthority('valmentaja')">Toiminnot</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.phone}"></td>
            <td th:text="${user.bday}"></td>
            <td th:text="${user.role.name}"></td>
            <td sec:authorize="hasAuthority('valmentaja')">
                <a th:href="@{/users/edit/{id}(id=${user.id})}">Muokkaa</a>
                <a th:href="@{/users/delete/{id}(id=${user.id})}">Poista</a>
            </td>
            
        </tr>
    </table>
    <a sec:authorize="hasAuthority('valmentaja')" href="/users/new">Lisää uusi käyttäjä</a>
    <footer>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </footer>
</body>

</html>
